<th:block th:fragment="popup_material_new_save">
  <script id="popup_MatSaveTemplate" type="text/x-tmpl">
    <style>
    .CompSave input,
    .CompSave select {
      width: 350px;
      box-sizing: border-box;
    }
    </style>
    <div class="content_wrap popup" id="div_excel_upload">
       <div class="table-wrap">
         <form id="MaterialSaveForm">
           <table class="write-table">
             <caption>거래처 등록 테이블</caption>
             <tbody class="CompSave">
               <tr>
                 <th>
                    <label for="MaterialGroup_id"><span class="eq">*</span>품목그룹</label>
                 </th>
                 <td>
                    <select id="MaterialGroup_id" name="MaterialGroup_id" required>
                    </select>
                 </td>

                 <th>
                     <label for="Name"><span class="eq">*</span>품목명</label>
                 </th>
                 <td >
                     <input type="text"  id="Name" name="Name" required>
                 </td>

               </tr>

               <tr>
                  <th>
                    <label for="Class1"><span class="eq">*</span>1차공정</label>
                  </th>
                  <td>
                    <select id="Class1" name="Class1" required></select>
                  </td>

                  <th>
                    <label for="Class2"><span class="eq">*</span>2차공정</label>
                  </th>
                  <td>
                    <select id="Class2" name="Class2" required></select>
                  </td>
                </tr>

                <tr>
                  <th>
                    <label for="Class3"><span class="eq">*</span>3차공정</label>
                  </th>
                  <td>
                    <select id="Class3" name="Class3" required></select>
                  </td>

                  <th>
                    <label for="Code"><span class="eq">*</span>품목코드<br>(바코드)</label>
                  </th>
                  <td>
                    <input type="text" id="Code" name="Code" required />
                  </td>
                </tr>

               <tr>
                 <th>
                     <label for="Unit_id"><span class="eq">*</span>단위<br></label>
                 </th>
                 <td>
                     <select  id="Unit_id" name="Unit_id" required>
                     </select>
                 </td>

                 <th>
                     <label for="Factory_id"><span class="eq">*</span>공장</label>
                  </th>
                  <td>
                    <select type="text" id="Factory_id" name="Factory_id" > </select>
                  </td>

               </tr>

               <tr>
                <th>
                   <label for="WorkCenter_id"><span class="eq">*</span>워크센터</label>
                </th>
                <td>
                    <select type="text" id="WorkCenter_id" name="WorkCenter_id" > </select>
                </td>
               </tr>

             </tbody>
           </table>
         </form>
       </div>
       <div class="popup-button">
         <button type="button" class="btn-popup y_write_auth" id="btnPopMatSave">저장</button>
         <button type="button" class="btn-popup" id="modal-close-button">닫기</button>
       </div>
     </div>
  </script>
  <script type="text/javascript">
   class PopMatSaveComponent {
    static currentInstance = null;

    constructor({saveUrl = '/api/sales/suju/save_material'} = {}) {
     if (PopMatSaveComponent.currentInstance) {
      PopMatSaveComponent.currentInstance.close();
     }
     PopMatSaveComponent.currentInstance = this;

     this.saveUrl = saveUrl;
     this.modalContainer = new PopupDraggable('품목 등록');
     this._escHandler = null;
     this.focusAfterClose = null;
    }

    show({onSaved = null, focusAfterClose = null} = {}) {
     this.onSaved = onSaved;
     this.focusAfterClose = focusAfterClose || document.activeElement;

     const $content = $(tmpl('popup_MatSaveTemplate', {}));
     this.modalContainer.open({width: 1000, height: 380, $content});

     const $form = $content.find('#MaterialSaveForm');
     const $matGroup = $content.find('#MaterialGroup_id');
     const $unitSel = $content.find('#Unit_id');
     const $factory = $content.find('#Factory_id');
     const $workcenter = $content.find('#WorkCenter_id');

     const $class1 = $content.find('#Class1');
     const $class2 = $content.find('#Class2');
     const $class3 = $content.find('#Class3');
     const $code = $content.find('#Code');

     AjaxUtil.fillSelectOptions($matGroup, 'material_group', '', false);
     AjaxUtil.fillSelectOptions($unitSel, 'unit', '', false);
     AjaxUtil.fillSelectOptions($factory, 'factory', '', false);

     AjaxUtil.fillSelectOptions($class1, 'user_code', 'choose', '', 'JFLAG');
     AjaxUtil.fillSelectOptions($class3, 'user_code', 'all', '', 'JFLAG3');

     // ===== 품목코드 자동체번 (팝업용) =====
     function updateMaterialCode() {
      const c1 = $class1.val()?.trim() || '';
      const c2 = $class2.val()?.trim() || '';
      const c3 = $class3.val()?.trim() || '';

      // prefix 규칙(너가 쓰던 방식)
      let prefix = '';
      if (c2 && c3) prefix = `${c2}${c3}`;
      else if (c2) prefix = c2;
      else if (c1) prefix = c1;
      else {
       $code.val('');
       return;
      }

      $.ajax({
       url: '/api/definition/material/nextCode',
       type: 'GET',
       dataType: 'json',
       data: {prefix}
      })
      .done((res) => {
       const next = res?.data?.nextNumber;
       const nextNum = (next != null) ? String(next).padStart(3, '0') : '001';
       $code.val(prefix + nextNum);
      })
      .fail(() => {
       $code.val(prefix + '001');
      });
     }

     // 1차 변경 → 2차 재로딩
     $class1.on('change', function () {
      const selectedValue = $(this).val();

      $class2.empty().append('<option value="">선택하세요</option>');

      if (selectedValue) {
       AjaxUtil.fillSelectOptions($class2, 'user_code', 'choose', '', selectedValue);
      }
      setTimeout(updateMaterialCode, 0);
     });

     $class2.on('change', updateMaterialCode);
     $class3.on('change', updateMaterialCode);

     setTimeout(updateMaterialCode, 0);

     // 최초 진입 시 2차 기본 상태
     $class2.empty().append('<option value="">선택하세요</option>');

     /*function loadMaterialMids(parentId, { $target = $midSel, selectedId = '' } = {}) {
        // 초기화 및 로딩 상태
        $target.prop('disabled', true)
          .empty()
          //.append('<option value="">로딩중...</option>');

        if (!parentId) {
          $target.empty()
            .append('<option value="">선택</option>')
            .prop('disabled', false);
          return;
        }

        $.ajax({
          url: '/api/definition/material/children',
          type: 'GET',
          data: { parentId },
        })
          .done((res) => {
            $target.empty().append('<option value="">선택</option>');
            if (res && res.success && Array.isArray(res.data)) {
              res.data.forEach(item => {
                // item: { id, value } 가정
                const opt = $('<option/>', { value: item.id, text: item.value });
                $target.append(opt);
              });
              if (selectedId) $target.val(String(selectedId));
            }
          })
          .fail((err) => {
            console.error('중분류 로딩 오류', err);
            Notify.error('중분류 데이터를 불러오지 못했습니다.');
            $target.empty().append('<option value="">선택</option>');
          })
          .always(() => {
            $target.prop('disabled', false);
          });
      }

      // 품목그룹 변경 시 중분류 갱신
      $matGroup.on('change', function () {
        const groupId = $(this).val();
        loadMaterialMids(groupId);
      });

      // (선택) 최초 진입 시, 기본 그룹 선택값이 있으면 중분류 선로딩
      const initialGroupId = $matGroup.val();
      if (initialGroupId) {
        loadMaterialMids(initialGroupId /!* , { selectedId: '초기선택값' } *!/);
      } else {
        $midSel.empty().append('<option value="">선택</option>');
      }*/

     // 닫기
     const doClose = () => this.close();
     $content.find('#modal-close-button').on('click', doClose);

     // 워크센터 로딩 (공장 선택값에 따라)
     function loadWorkCenters(factoryId, {
      $target = $workcenter,
      selectedId = '',
     } = {}) {
      // 초기화 및 로딩 상태
      $target.prop('disabled', true).empty();

      if (!factoryId) {
       $target.append('<option value="">선택</option>').prop('disabled', false);
       return;
      }

      // 서버에 보낼 파라미터 구성
      const params = {factoryId};

      $.ajax({
       url: '/api/sales/suju/workcenter_list',
       type: 'GET',
       dataType: 'json',
       data: {factoryId}
      })
      .done((res) => {
       $target.empty().append('<option value="">선택</option>');
       if (res && res.success && Array.isArray(res.data)) {
        res.data.forEach(item => {
         const id = item.id ?? item.value;
         const text = item.text ?? item.value ?? item.Name ?? id;
         $target.append($('<option/>', {value: id, text}));
        });
        if (selectedId) $target.val(String(selectedId));
       }
      })
      .fail((err) => {
       console.error('워크센터 로딩 오류', err);
       Notify.error('워크센터 데이터를 불러오지 못했습니다.');
       $target.empty().append('<option value="">선택</option>');
      })
      .always(() => {
       $target.prop('disabled', false);
      });
     }

     // 공장 변경 → 워크센터 갱신
     $factory.on('change', function () {
      const factoryId = $(this).val();
      loadWorkCenters(factoryId);
     });

     const initialFactoryId = $factory.val();
     if (initialFactoryId) {
      loadWorkCenters(initialFactoryId /*, { selectedId: presetWorkCenterId }*/);
     } else {
      $workcenter.empty().append('<option value="">선택</option>');
     }


     // 저장
     $content.find('#btnPopMatSave').on('click', () => {
      let $MaterialSaveForm = $content.find('#MaterialSaveForm');
      let data = FormUtil.extractForm($MaterialSaveForm);
      // FormData 직렬화 (프로젝트 공통 유틸이 없을 경우 대비)
      $form.serializeArray().forEach(({name, value}) => {
       data[name] = (value ?? '').trim();
      });
      data.spjangcd = (sessionStorage.getItem('spjangcd') || '').trim();
      // 필수값 검사
      const required = [
       ['#MaterialGroup_id', '품목그룹'],
       ['#Name', '품목명'],
       ['#Unit_id', '단위'],
       ['#Factory_id', '공장'],
       ['#WorkCenter_id', '워크센터'],
       ['#Class1', '1차공정'],
       ['#Class2', '2차공정'],
       ['#Class3', '3차공정'],
       ['#Code', '품목코드']
      ];
      for (const [sel, label] of required) {
       const $el = $content.find(sel);
       if (!$el.val()) {
        Alert.alert('', `${label}을(를) 입력해 주세요.`);
        $el.focus();
        return;
       }
      }

      AjaxUtil.postAsyncData(this.saveUrl, data, (res) => {
       if (res && res.success) {
        Notify.success('저장되었습니다.');
        Alert.alert('', '품목이 등록되었습니다.\nBOM은 추가로 등록하신 후 생산을 진행해 주세요.');
        if (typeof this.onSaved === 'function') this.onSaved(res.data);
        doClose();
       } else {
        Alert.alert('', (res && res.message) ? res.message : '저장에 실패했습니다.');
       }
      });
     });

     // ESC 닫기
     this._escHandler = (e) => {
      if (e.key === 'Escape' || e.keyCode === 27) doClose();
     };
     $(document).on('keydown.popupesc', this._escHandler);

     // 닫힘 후 포커스 복원 & 이벤트 해제
     this.modalContainer.onClose = () => {
      $(document).off('keydown.popupesc', this._escHandler);
      if (this.focusAfterClose && document.body.contains(this.focusAfterClose)) {
       setTimeout(() => this.focusAfterClose.focus(), 50);
      }
     };
    }

    close() {
     this.modalContainer.close();
     if (this.modalContainer.$content) {
      this.modalContainer.$content.remove();
      this.modalContainer.$content = null;
     }
     $(document).off('keydown.popupesc', this._escHandler);
     if (PopMatSaveComponent.currentInstance === this) {
      PopMatSaveComponent.currentInstance = null;
     }
    }
   }
  </script>
</th:block>
