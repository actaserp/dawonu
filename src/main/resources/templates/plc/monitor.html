<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SY폴리텍 현장 모니터링</title>
    <style>
        /*
         * 현장 대형 모니터에서 떨어져 보는 화면이다.
         * 색은 기존 WinForms 현장화면(sample.png)을 따른다 —
         * 회색 바탕 / 흰 칸 + 검은 테두리 / 검정 머리글에 흰 글자 /
         * 네이비 라벨 / 검정 바탕에 초록 값 / 상태는 빨강·초록.
         * 모서리는 둥글리지 않는다. 원본이 각진 격자다.
         */
        :root {
            --bg:     #808080;   /* 바탕 회색 */
            --paper:  #ffffff;   /* 칸 */
            --ink:    #000000;   /* 테두리·글자 */
            --ink-2:  #333333;   /* 보조 글자 */
            --muted:  #666666;
            --navy:   #000080;   /* 라벨 띠 */
            --green:  #00e000;   /* 검정 바탕 위 계측값 */
            --green-d:#008000;   /* 완료 */
            --red:    #ff0000;   /* 정지·오류 */
            --cyan:   #00c8ff;
        }

        * { box-sizing: border-box; }
        /*
         * 현장은 대형 모니터에 F11 전체화면으로 띄운다.
         * 화면 전체를 세로로 한 번에 담고 페이지 스크롤은 만들지 않는다.
         * 창이 작아 다 못 담을 때만 본문(.wrap)이 안에서 스크롤한다.
         */
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
            font-size: 17px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        a { color: inherit; }

        header {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 20px;
            background: var(--ink);
            border-bottom: 2px solid var(--ink);
            flex: 0 0 auto; z-index: 20;
        }
        header select, header input[type=date], header button {
            padding: 7px 11px; background: var(--paper); color: var(--ink);
            border: 2px solid var(--ink); border-radius: 0; font-size: 15px; cursor: pointer;
        }
        header button:hover, header select:hover { background: #d9d9d9; }
        header label { font-size: 15px; color: #ffffff; font-weight: 600; }
        header button#pauseBtn.paused {
            background: var(--red); border-color: var(--ink); color: #ffffff; font-weight: 700;
        }
        header button#pauseBtn:disabled { opacity: .45; cursor: default; }
        button.link {
            background: none; border: 0; color: var(--cyan); text-decoration: underline;
            cursor: pointer; font-size: 14px; padding: 0;
        }

        .wrap {
            padding: 14px 20px 16px; max-width: 1900px; margin: 0 auto; width: 100%;
            flex: 1 1 auto; min-height: 0;
            display: flex; flex-direction: column;
            overflow: auto;   /* 다 못 담는 작은 창에서만 여기서 스크롤한다 */
        }
        .machinebar, .section-h, #equip, #error { flex: 0 0 auto; }

        /*
         * 호기 탭 — 헤더 줄에 얹는다. 본문에서 한 줄(약 60px)을 빼기 위해서다.
         * 호기가 12개라 줄바꿈하면 헤더가 두 줄이 되어 효과가 없다.
         * 남는 폭을 전부 차지하되 모자라면 가로로만 스크롤한다.
         */
        .tabs {
            display: flex; gap: 5px; margin: 0;
            flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden;
            padding-bottom: 6px;          /* 스크롤바가 탭을 가리지 않게 */
            scrollbar-width: thin;
            scrollbar-color: #ffffff #3a3a3a;
        }
        /* 검정 헤더 위라 스크롤바를 흰색으로 둬야 보인다. 기본값은 거의 안 보인다. */
        .tabs::-webkit-scrollbar { height: 8px; }
        .tabs::-webkit-scrollbar-track { background: #3a3a3a; }
        .tabs::-webkit-scrollbar-thumb { background: #ffffff; }
        .tabs::-webkit-scrollbar-thumb:hover { background: #d9d9d9; }
        .tab {
            padding: 6px 10px; border-radius: 0; font-size: 15px; cursor: pointer;
            background: var(--paper); border: 2px solid var(--ink); color: var(--ink);
            white-space: nowrap; flex: 0 0 auto;
        }
        .tab:hover { background: #d9d9d9; }
        .tab.on { background: var(--navy); border-color: var(--ink); color: #fff; font-weight: 700; }
        .tab .cnt {
            display: inline-block; margin-left: 5px; padding: 0 6px; border-radius: 0;
            background: var(--ink); color: #fff; font-size: 13px; font-weight: 700;
        }
        .tab.on .cnt { background: rgba(255,255,255,.26); }

        /*
         * 호기 머리 — 레이아웃 목업(20261019) 배치다.
         * 호기명은 바 폭의 가운데, 설비상태는 우상단에 라벨/값 두 줄 박스.
         * 설비상태 박스를 absolute 로 띄워야 호기명이 바 폭의 가운데에 온다.
         * flex 로 나란히 두면 박스 폭의 절반만큼 호기명이 왼쪽으로 밀린다.
         */
        .machinebar {
            position: relative;
            background: var(--paper);
            border: 2px solid var(--ink); border-bottom: 0;
            border-radius: 0;
            padding: 16px 24px 14px;
            text-align: center;
        }
        .machinebar h1 { margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -1.2px; color: var(--ink); }
        /*
         * 호기 바의 오른쪽 위 모서리에 붙인다.
         * 띄워 두면 위·오른쪽에 회색 바탕이 비쳐 칸이 덜 그려진 것처럼 보인다.
         * 바깥 테두리는 호기 바의 테두리를 그대로 쓰고 안쪽 두 면만 긋는다.
         */
        .machinebar .state {
            position: absolute; top: 0; right: 0;
            min-width: 240px; max-width: 340px;
            border: 0;
            border-left: 2px solid var(--ink);
            border-bottom: 2px solid var(--ink);
            border-radius: 0;
            background: var(--paper); overflow: hidden;
        }
        .machinebar .state .cap {
            display: block; padding: 5px 12px;
            font-size: 14px; font-weight: 700; color: #ffffff;
            background: var(--ink); border-bottom: 2px solid var(--ink);
        }
        .machinebar .state .val { display: block; padding: 8px 12px; font-size: 22px; font-weight: 800; }
        .machinebar .state .val.none { font-size: 16px; font-weight: 600; color: var(--muted); }
        .machinebar .state .val.none small { font-size: 13px; font-weight: 500; color: var(--muted); }
        /* 판정이 정해지면 쓸 상태색. 원본 화면도 정지를 빨강으로 채웠다. */
        .machinebar .state .val.st-run  { background: var(--green-d); color: #fff; }
        .machinebar .state .val.st-stop { background: var(--red);     color: #fff; }
        .machinebar .state .val.st-fix  { background: #ffd200;        color: var(--ink); }

        /* 작업지시 표 — 흰 칸에 검은 글자, 머리글은 검정에 흰 글자. */
        .panel {
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 0;
            /* 행 수를 5행으로 잘라 그리므로(windowRows) 세로 스크롤은 생기지 않는다.
               가로는 컬럼이 많아 좁은 창에서 필요할 수 있어 열어 둔다. */
            overflow: auto;
            /* 세로가 모자라면 이 표가 먼저 줄어든다. 늘어나지는 않는다. */
            flex: 0 1 auto; min-height: 0;
        }
        table { width: 100%; border-collapse: collapse; min-width: 1180px; }
        th, td { padding: 13px 16px; text-align: left; white-space: nowrap; }
        th {
            font-size: 15px; color: #ffffff; font-weight: 700;
            background: var(--ink);
            border-bottom: 2px solid var(--ink);
            /* 표가 세로로 스크롤되므로 머리글은 붙여 둔다.
               sticky 셀은 border 가 같이 스크롤돼 사라져서 그림자로 한 번 더 긋는다. */
            position: sticky; top: 0; z-index: 2;
            /* 검정 머리글이라 칸 구분선은 흰색으로 긋는다. */
            box-shadow: inset -2px 0 0 #ffffff, inset 0 -2px 0 var(--ink);
        }
        th:last-child { box-shadow: inset 0 -2px 0 var(--ink); }
        /* 행·칸 구분선을 확실하게. 목업처럼 세로선까지 그어 칸을 나눈다. */
        tbody td {
            border-bottom: 2px solid var(--ink); border-right: 2px solid var(--ink);
            font-size: 18px; color: var(--ink);
        }
        tbody td:last-child { border-right: 0; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: #e6e6e6; }

        td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
        td.tm { font-variant-numeric: tabular-nums; font-weight: 700; }
        td.tm.off { color: var(--muted); font-weight: 500; }
        td.name { white-space: normal; min-width: 210px; }
        td.name .sub { font-size: 14px; color: var(--ink-2); font-weight: 600; margin-top: 4px; }

        /* 상태는 좌측 액센트로만 준다. 칸 바탕은 원본처럼 흰색으로 둔다. */
        tbody tr td:first-child { border-left: 6px solid transparent; }
        tr.done    td:first-child { border-left-color: var(--green-d); }
        tr.running td:first-child { border-left-color: var(--navy); }
        tr.waiting td:first-child { border-left-color: #808080; }

        /* 작업상태는 글자만. 박스로 감싸지 않는다. */
        td.st { font-weight: 800; }
        td.s-DONE    { color: var(--green-d); }
        td.s-RUNNING { color: var(--navy); }
        td.s-WAITING { color: var(--ink); }

        .bar {
            height: 8px; background: var(--paper); border: 1px solid var(--ink);
            border-radius: 0; overflow: hidden; margin-top: 6px; min-width: 90px;
        }
        .bar > i { display: block; height: 100%; background: var(--navy); }

        .empty { padding: 48px 20px; text-align: center; color: var(--ink-2); font-size: 18px; line-height: 1.9; }
        .empty b { color: var(--ink); }
        .err {
            margin: 14px 0; padding: 14px 18px; border-radius: 0; font-size: 16px; font-weight: 700;
            background: var(--red); border: 2px solid var(--ink); color: #ffffff;
        }

        /* 하단 설비 현황 */
        .section-h {
            margin: 16px 0 10px; font-size: 20px; font-weight: 800; color: var(--ink);
            display: flex; align-items: center; gap: 12px;
        }
        /* PLC 최신값을 언제 받은 것인지. 값이 언제 것인지 모르면 숫자를 믿을 수 없다. */
        .section-h .tag {
            font-size: 14px; font-weight: 700; padding: 3px 11px; border-radius: 0;
            background: var(--ink); border: 2px solid var(--ink); color: var(--green);
            font-variant-numeric: tabular-nums;
        }
        .section-h .tag:empty { display: none; }
        .section-h .tag.dead { color: #ff6b6b; }
        .section-h label { color: var(--ink); }
        .placeholder {
            padding: 22px 24px; border: 2px solid var(--ink); border-radius: 0;
            color: var(--ink); font-size: 17px; line-height: 2; background: var(--paper);
        }
        .placeholder b { color: var(--ink); }

        /* 선택된 행 */
        tbody tr.sel td { box-shadow: inset 0 0 0 9999px rgba(0,0,128,.12); }
        tbody tr.sel td:first-child { border-left-width: 10px; }
        tbody tr { cursor: pointer; }

        /*
         * 설비 현황 — 레이아웃 목업(20261019) 그대로다.
         * 1행 거래처/품목명/규격, 2행 믹서(시간·온도), 3행 압출(구역별 온도 + RPM).
         * 접점 식별자·kind·freshness·임계값은 현장에서 볼 것이 아니라 전부 뺐다.
         * (원값이 필요하면 /api/plc/points 로 조회한다.)
         */
        .eq { background: var(--paper); border: 2px solid var(--ink); border-radius: 0; overflow: hidden; }
        .eq .strip { display: grid; border-bottom: 2px solid var(--ink); }
        .eq .strip.r1 { grid-template-columns: 1fr 2fr 1fr; }
        .eq .cell { padding: 0 0 11px; border-right: 2px solid var(--ink); text-align: center; }
        .eq .cell:last-child { border-right: 0; }
        /* 라벨은 원본처럼 검정 띠로 깐다. */
        .eq .cell .k {
            display: block; padding: 6px 10px; margin-bottom: 10px;
            font-size: 15px; color: #ffffff; font-weight: 700;
            background: var(--ink);
        }
        /* 멀리서 가장 먼저 읽는 줄이라 크게 뽑는다. 길면 줄바꿈해서 내려간다. */
        .eq .cell .v {
            font-size: 32px; font-weight: 800; color: var(--ink);
            padding: 0 12px; line-height: 1.25; white-space: normal;
        }

        /* 믹서·압출 블록은 목업이 격자표라 표로 짠다. 칸 경계가 전부 보여야 한다. */
        .eq table.blk { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .eq table.blk th, .eq table.blk td {
            border: 2px solid var(--ink); padding: 10px 8px;
            text-align: center; white-space: nowrap;
        }
        .eq table.blk th { background: var(--ink); font-size: 15px; font-weight: 700; color: #ffffff; }
        .eq table.blk td { background: var(--paper); font-size: 21px; font-weight: 800; color: var(--ink); }
        /* 좌측 믹서 / 압출 라벨 칸 */
        .eq table.blk th.side { width: 92px; background: var(--ink); font-size: 19px; font-weight: 800; }
        /* 행 머리(구역 / 셋팅온도 / 현재온도) — 원본 하단 타일의 네이비 라벨이다. */
        .eq table.blk th.rowh { width: 112px; background: var(--navy); }
        /* 계측값 한 칸은 원본처럼 검정 바탕에 초록 글자로 띄운다. */
        .eq table.blk td.rpm { background: var(--ink); color: var(--green); font-size: 27px; }
        /* 접점이 없어 채울 수 없는 칸. 0 과 헷갈리지 않게 — 로 둔다. */
        .eq table.blk td.none { color: #808080; font-size: 17px; font-weight: 600; }
        .eq table.blk tr.hd th { background: var(--ink); }
        .eq .blkwrap { overflow-x: auto; }

    </style>
</head>
<body>

<header>
    <label for="dt">지시일자</label>
    <input type="date" id="dt">
    <button type="button" id="latestBtn" class="link">최근 지시일로</button>
    <label for="rot">호기 순환</label>
    <select id="rot">
        <option value="0">안 함</option>
        <option value="30" selected>30초</option>
        <option value="60">60초</option>
        <option value="120">120초</option>
    </select>
    <button type="button" id="pauseBtn">|| 일시정지</button>
    <!-- 호기 탭은 헤더에 둔다. 본문 세로를 한 줄이라도 더 쓰려는 것이다. -->
    <div class="tabs" id="tabs"></div>
    <form th:action="@{/plc/logout}" method="post" style="margin:0">
        <button type="submit">로그아웃</button>
    </form>
</header>

<div class="wrap">
    <div id="error" class="err" style="display:none"></div>

    <div class="machinebar">
        <h1 id="mcName">—</h1>
        <div class="state">
            <span class="cap">설비상태</span>
            <span class="val none" id="mcState">—</span>
        </div>
    </div>

    <div class="panel" id="panel"></div>

    <div class="section-h">
        설비 현황
        <span class="tag" id="plcAt"></span>
    </div>
    <div id="equip"></div>
</div>

<script th:inline="none">
(function () {
    'use strict';

    var el = function (id) { return document.getElementById(id); };
    var state = { machines: [], rows: [], sel: null, selPdir: null, latest: null, paused: false };
    var rotTimer = null;

    function esc(s) {
        if (s === null || s === undefined) { return ''; }
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // 소수점 뒤 불필요한 0을 떨어내고 천단위 구분을 넣는다.
    function num(v, dp) {
        if (v === null || v === undefined || v === '') { return '-'; }
        var n = Number(v);
        if (!isFinite(n)) { return '-'; }
        var s = parseFloat(n.toFixed(dp === undefined ? 3 : dp));
        return s.toLocaleString('ko-KR', { maximumFractionDigits: 3 });
    }

    function today() {
        var d = new Date();
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0');
    }

    function get(url) {
        return fetch(url, { credentials: 'same-origin' }).then(function (r) {
            if (r.status === 401 || r.redirected) {
                location.href = '/plc/login';
                throw new Error('세션이 만료되었습니다.');
            }
            return r.json().then(function (body) {
                if (!r.ok) {
                    throw new Error(body && body.message ? body.message : ('요청 실패 (' + r.status + ')'));
                }
                return body;
            });
        });
    }

    function renderTabs() {
        // 헤더 한 줄에 12개가 들어가야 해서 "믹서7호기(XLPE)" 대신 "7호기"로 줄인다.
        // 전체 이름은 선택하면 호기 바에 크게 나오고, 여기서는 title 로만 남긴다.
        el('tabs').innerHTML = state.machines.map(function (m) {
            var on = (m.equiCd === state.sel) ? ' on' : '';
            var cnt = m.totalCount ? '<span class="cnt">' + m.totalCount + '</span>' : '';
            var label = m.machineNo ? (m.machineNo + '호기') : (m.equiNm || m.equiCd);
            return '<div class="tab' + on + '" data-equi="' + esc(m.equiCd) + '"' +
                   ' title="' + esc(m.equiNm || '') + '">' +
                   esc(label) + cnt + '</div>';
        }).join('');

        // 설비가 늘어 탭이 가로로 넘치면 선택된 호기가 화면 밖에 있을 수 있다.
        // 특히 호기 순환이 돌 때 그렇다. 보이는 자리로 끌어온다.
        // scrollIntoView 는 조상까지 스크롤해서 쓰지 않고 scrollLeft 만 건드린다.
        var box = el('tabs');
        var onTab = box.querySelector('.tab.on');
        if (onTab) {
            var l = onTab.offsetLeft;
            var r = l + onTab.offsetWidth;
            if (l < box.scrollLeft) {
                box.scrollLeft = l - 8;
            } else if (r > box.scrollLeft + box.clientWidth) {
                box.scrollLeft = r - box.clientWidth + 8;
            }
        }

        Array.prototype.forEach.call(el('tabs').querySelectorAll('.tab'), function (t) {
            t.addEventListener('click', function () {
                state.sel = t.getAttribute("data-equi");
                state.selPdir = null;
                renderAll();
                loadEquipment();
            });
        });
    }

    function renderHead() {
        var m = state.machines.filter(function (x) { return x.equiCd === state.sel; })[0];
        if (!m) {
            el('mcName').textContent = '—';
            return;
        }
        el('mcName').textContent = m.equiNm || m.equiCd;

        // 설비상태는 판정 근거가 없어 값을 만들지 않는다. 서버가 null 을 준다.
        var st = el('mcState');
        if (m.statusName) {
            // 원본 화면의 상태색 — 가동중 초록 / 수리 노랑 / 정지 빨강.
            var sc = { "가동중": " st-run", "수리": " st-fix", "정지": " st-stop" }[m.statusName] || "";
            st.className = "val" + sc;
            st.textContent = m.statusName;
        } else {
            st.className = 'val none';
            st.innerHTML = "판정 보류 <small>· 가동상태 근거 미확정</small>";
        }
    }

    // 'yyyy-MM-ddTHH:mm:ss' -> 'yy/MM/dd'. 목업(20261019) 의 완료일자 표기다.
    function ymd(s) {
        if (!s) { return '-'; }
        var p = String(s).substring(0, 10).split('-');
        return (p.length === 3) ? p[0].substring(2) + '/' + p[1] + '/' + p[2] : '-';
    }

    // 목업의 "시간" 칸은 작업 시작~완료 구간이다.
    // 아직 도는 지시는 완료시각이 없으므로 '12:00 ~' 처럼 열어 둔다.
    function span(r) {
        if (!r.startedAt) { return '-'; }
        return r.finishedAt ? (hhmm(r.startedAt) + ' ~ ' + hhmm(r.finishedAt))
                            : (hhmm(r.startedAt) + ' ~');
    }

    /*
     * 표는 5행까지만 그린다. 스크롤하지 않는다.
     * 넘치는 지시를 숨겨도 된다는 것은 확인받았고, 호기 탭의 건수 배지에
     * 그 호기의 전체 지시 건수가 그대로 나와 있어 몇 건이 있는지는 보인다.
     */
    var VISIBLE_ROWS = 5;

    /*
     * 표의 행 순서 — 시간축이다. 위가 미래, 아래가 과거.
     *
     *   위   대기   (아직 안 한 것. 맨 위가 가장 나중 것)
     *   중간 진행중 (지금 돌고 있는 것)
     *   아래 완료   (끝난 것. 바로 아래가 가장 최근에 끝난 것)
     *
     * 대기는 '다음에 할 것'이 진행중 바로 위에 붙도록 역순으로 쌓고,
     * 완료는 '방금 끝난 것'이 진행중 바로 아래에 붙도록 최신순으로 쌓는다.
     * 그래야 진행중 행을 기준으로 위아래가 시간 순서대로 읽힌다.
     */
    function seqKey(r) {
        return String(r.pdirNo || '') + '-' + String(r.pdirSq === null || r.pdirSq === undefined ? '' : r.pdirSq);
    }

    function orderRows(rows) {
        var wait = rows.filter(function (r) { return r.statusCode === 'WAITING'; });
        var run  = rows.filter(function (r) { return r.statusCode === 'RUNNING'; });
        var done = rows.filter(function (r) { return r.statusCode === 'DONE'; });

        // 지시번호 역순 — 가장 나중에 할 것이 맨 위로 간다.
        wait.sort(function (a, b) { return seqKey(b).localeCompare(seqKey(a)); });
        run.sort(function (a, b) { return seqKey(a).localeCompare(seqKey(b)); });
        // 완료시각이 없는 건(선언만 완료)은 지시번호로 떨어뜨린다.
        done.sort(function (a, b) {
            var x = a.finishedAt || '', y = b.finishedAt || '';
            if (x !== y) { return y.localeCompare(x); }
            return seqKey(b).localeCompare(seqKey(a));
        });

        return wait.concat(run, done);
    }

    /*
     * 진행중 행을 가운데 두고 위아래로 n 행만 잘라낸다.
     * 스크롤 대신 아예 안 그리는 쪽이다.
     *
     * 한쪽이 모자라면 반대쪽에서 채워 항상 n 행을 채운다.
     * 예) 1호기처럼 완료가 하나도 없으면(진행중 1 + 대기 6)
     *     진행중이 맨 아래에 오고 그 위로 대기 4건이 보인다.
     * 진행중이 없으면 맨 위(가장 나중에 할 대기)부터 n 행이다.
     */
    function windowRows(rows, n) {
        if (rows.length <= n) { return rows; }

        var i = -1;
        for (var k = 0; k < rows.length; k++) {
            if (rows[k].statusCode === 'RUNNING') { i = k; break; }
        }
        if (i < 0) { return rows.slice(0, n); }

        var start = i - Math.floor((n - 1) / 2);
        if (start + n > rows.length) { start = rows.length - n; }
        if (start < 0) { start = 0; }
        return rows.slice(start, start + n);
    }

    function renderTable() {
        var rows = windowRows(
                orderRows(state.rows.filter(function (r) { return r.equiCd === state.sel; })),
                VISIBLE_ROWS);

        if (!rows.length) {
            var hint = '';
            if (state.latest && state.latest !== el('dt').value) {
                hint = '<br>가장 최근 지시일자는 <b>' + esc(state.latest) + '</b> 이다.';
            }
            el('panel').innerHTML = '<div class="empty">이 호기의 해당 일자 작업지시가 없다.' + hint + '</div>';
            return;
        }

        var body = rows.map(function (r) {
            var cls = r.statusCode === 'DONE' ? 'done'
                    : (r.statusCode === 'RUNNING' ? 'running' : 'waiting');
            var pct = (r.progressRate === null || r.progressRate === undefined)
                    ? null : Math.max(0, Math.min(100, Number(r.progressRate)));
            var sel = (r.pdirNo === state.selPdir) ? ' sel' : '';
            var done = r.finishedAt ? '' : ' off';
            return '<tr class="' + cls + sel + '" data-pdir="' + esc(r.pdirNo) + '">' +
                '<td class="name">' + esc(r.vendNm || '-') + '</td>' +
                '<td class="name">' + esc(r.itemNm || '-') +
                    '<div class="sub">' + esc(r.itemCd || '') +
                    (r.pdirClsNm ? ' · ' + esc(r.pdirClsNm) : '') + '</div></td>' +
                '<td>' + esc(r.itemSize || '-') + '</td>' +
                '<td class="num">' + num(r.pdirWt) + '</td>' +
                '<td class="num">' + num(r.producedWt) +
                    (pct === null ? '' : '<div class="bar"><i style="width:' + pct + '%"></i></div>') + '</td>' +
                '<td class="num">' + num(r.batchQty, 0) + '</td>' +
                '<td class="num">' + num(r.workBatchQty, 0) + '</td>' +
                '<td class="st s-' + esc(r.statusCode) + '">' + esc(r.statusName) + '</td>' +
                '<td class="tm' + done + '">' + ymd(r.finishedAt) + '</td>' +
                '<td class="tm' + done + '">' + span(r) + '</td>' +
            '</tr>';
        }).join('');

        el('panel').innerHTML =
            '<table><thead><tr>' +
            '<th>업체명</th><th>제품명</th><th>규격</th>' +
            '<th style="text-align:right">작업지시량</th>' +
            '<th style="text-align:right">생산량</th>' +
            '<th style="text-align:right">지시Batch</th>' +
            '<th style="text-align:right">작업Batch</th>' +
            '<th>작업상태</th><th>완료일자</th><th>시간</th>' +
            '</tr></thead><tbody>' + body + '</tbody></table>';

        Array.prototype.forEach.call(el('panel').querySelectorAll('tbody tr'), function (tr) {
            tr.addEventListener('click', function () {
                state.selPdir = tr.getAttribute('data-pdir');
                renderTable();
                loadEquipment();
            });
        });
    }

    // 한 설비에 진행중 지시가 둘일 수 없으니 진행중을 자동으로 고른다.
    // 진행중이 없으면 마지막 건으로 떨어뜨린다.
    function autoSelect() {
        var rows = orderRows(state.rows.filter(function (r) { return r.equiCd === state.sel; }));
        if (!rows.length) { state.selPdir = null; return; }
        if (state.selPdir && rows.some(function (r) { return r.pdirNo === state.selPdir; })) { return; }
        var run = rows.filter(function (r) { return r.statusCode === 'RUNNING'; })[0];
        // 진행중이 없으면 가장 최근에 끝난 건(완료 블록의 맨 위)을 고른다.
        var done = rows.filter(function (r) { return r.statusCode === 'DONE'; })[0];
        state.selPdir = (run || done || rows[rows.length - 1]).pdirNo;
    }

    function hhmm(s) {
        if (!s) { return '-'; }
        return String(s).replace('T', ' ').substring(11, 16);
    }

    /*
     * 설비 현황 옆에 PLC 최신값을 언제 받은 것인지 적는다.
     * 수집이 멈춰도 마지막 값이 그대로 보이기 때문에(인수인계서 F7),
     * 숫자 옆에 시각이 없으면 옛날 값을 현재값으로 읽게 된다.
     * 접점마다 수집시각이 미세하게 다를 수 있어 가장 최근 것을 쓴다.
     */
    function plcStamp(pts) {
        var tag = el('plcAt');
        var newest = null, dead = false;
        (pts || []).forEach(function (x) {
            if (!x.collectedAt) { return; }
            if (newest === null || x.collectedAt > newest) { newest = x.collectedAt; }
            if (x.freshness === 'DEAD') { dead = true; }
        });
        if (newest === null) {
            tag.className = 'tag dead';
            tag.textContent = 'PLC 수집값 없음';
            return;
        }
        tag.className = dead ? 'tag dead' : 'tag';
        tag.textContent = 'PLC 최신값 ' + String(newest).replace('T', ' ').substring(0, 16) +
                          (dead ? ' (수집 끊김)' : '');
    }

    // 접점 명칭에서 구역 번호를 뽑는다. "1호기 생산라인 온도 3구역" -> 3
    function zoneNo(name) {
        var m = /(\d+)\s*구역/.exec(name || '');
        return m ? Number(m[1]) : null;
    }

    // 값 한 칸. 접점이 없거나 수집값이 없으면 0 과 헷갈리지 않게 — 로 둔다.
    function cellVal(v, dp) {
        var s = num(v, dp);
        return (s === '-') ? '<td class="none">—</td>' : '<td>' + s + '</td>';
    }

    /*
     * 설비 현황 — 레이아웃 목업(20261019) 구조 그대로 그린다.
     *
     * 1행  거래처 / 품목명 / 규격        — 선택된 작업지시에서
     * 2행  믹서  셋팅온도 토출온도 시작시간 완료시간 믹서시간(분)
     * 3행  압출  구역 A1..An / 셋팅온도 / 현재온도 + 현재 RPM
     *
     * ★ 출처가 둘이다. 섞어 읽지 마라.
     *   - 현재온도 / 현재 RPM : PLC 실시간 수집값(DG2000M). 1분 주기로 들어온다.
     *   - 셋팅온도            : MES 기준정보(PD1016M 배선 + PD1016D 품목별 기준).
     *                           사람이 PD1016A10 화면에서 입력한 값이다.
     *                           PLC 수집기는 계측값 레지스터만 읽고 설정값은 수집 대상이 아니다.
     *
     * 구역 축은 PD1016M(압출 설비 × ZONE_NO)이 정식이다. 현재온도는 GATH_ID 로 맞춘다.
     * ★ 구역 순번으로 접점을 유추하지 마라 — 배선이 바뀌면 조용히 틀린 칸에 값이 들어간다.
     * PD1016M 에 배선이 아직 없는 호기는 PLC 접점 명칭 순으로 떨어뜨린다(셋팅온도는 빈칸).
     *
     * 셋팅온도가 null 이면 "기준없음"이고 0℃ 와 다르다. 0 으로 표시하면 안 된다(결함 F4).
     */
    function renderEquipment(d) {
        var p = d.pdir, b = d.batch, plc = d.plc || {};
        var pts = plc.points || [];
        var st = d.setTemp || {};
        var zones = st.zones || [];

        plcStamp(pts);

        if (!p) {
            el('equip').innerHTML =
                '<div class="placeholder">이 호기의 해당 일자 작업지시가 없어 표시할 설비 현황이 없다.</div>';
            return;
        }

        // PLC 접점을 GATH_ID 로 찾을 수 있게 색인한다.
        var byId = {};
        pts.forEach(function (x) { if (x.id) { byId[x.id] = x; } });

        // PLC 온도 접점 — 구역 번호 순. 1·2호기 7구역, 3호기 8구역이고 4·5호기는 온도 접점이 없다.
        var temps = pts.filter(function (x) {
            return x.kind === 'TEMP' && zoneNo(x.name) !== null;
        }).sort(function (a, b2) { return zoneNo(a.name) - zoneNo(b2.name); });

        var rpm = pts.filter(function (x) { return x.kind === 'RPM'; })[0] || null;

        /*
         * 구역 칸 — [셋팅온도, 현재온도] 한 쌍씩.
         * PD1016M 배선이 있으면 그걸 축으로 쓰고(현재온도는 GATH_ID 로 맞춤),
         * 없으면 기존처럼 PLC 접점만 늘어놓는다(셋팅온도 칸은 "기준없음").
         */
        var cells;
        if (zones.length) {
            cells = zones.map(function (z) {
                var pt = z.gathId ? byId[z.gathId] : null;
                return {
                    zoneNo: z.zoneNo,
                    label: 'A' + z.zoneNo,
                    title: z.zoneNm || '',
                    set: z.setTemp,
                    cur: pt ? pt.value : null
                };
            });
        } else {
            cells = temps.map(function (x, i) {
                return {
                    zoneNo: i + 1,
                    label: 'A' + (i + 1),
                    title: x.name || '',
                    set: null,
                    cur: x.value
                };
            });
        }

        var cols = cells.length;

        // 1행 — 거래처 / 품목명 / 규격
        var r1 =
            '<div class="strip r1">' +
              '<div class="cell"><div class="k">거래처</div><div class="v">' + esc(p.vendNm || '-') + '</div></div>' +
              '<div class="cell"><div class="k">품목명</div><div class="v">' + esc(p.itemNm || '-') + '</div></div>' +
              '<div class="cell"><div class="k">규격</div><div class="v">' + esc(p.itemSize || '-') + '</div></div>' +
            '</div>';

        // 2행 — 믹서.
        // 셋팅온도는 MES 기준정보(ZONE_NO=0 한 행). 믹서는 PLC 온도 접점이 없어 현재온도가 없다.
        // 시간은 PM1200M 최신 배치에서 온다. 완료시간은 그 배치가 돌고 있으면 아직 없다.
        var mixTime = (b && b.elapsedSeconds !== null && b.elapsedSeconds !== undefined)
                ? Math.floor(Number(b.elapsedSeconds) / 60) : null;
        var mixSet = (st.mixer && st.mixer.setTemp !== null && st.mixer.setTemp !== undefined)
                ? st.mixer.setTemp : null;
        var mixer =
            '<table class="blk"><tbody>' +
              '<tr class="hd">' +
                '<th class="side" rowspan="2">믹서</th>' +
                '<th>셋팅 온도</th><th>토출온도</th><th>시작시간</th><th>완료시간</th><th>믹서시간(분)</th>' +
              '</tr>' +
              '<tr>' +
                (mixSet === null ? '<td class="none" title="기준없음 — PD1016D 에 이 품목·설비의 셋팅온도가 없다">—</td>'
                                 : '<td>' + num(mixSet, 1) + '</td>') +
                // 토출온도 — 근거가 없어 비워 둔다.
                // "토출"이라는 접점이 70점에도, 명세서 118점에도 없다. PD1016D 에도 자리가 없다.
                // 압출 마지막 온도 구역을 갖다 꽂아 봤으나(목업 82℃ 자리에 155℃ 대가 찍힘)
                // 근거 없는 대입이라 뺐다 — _EC_VALUE 컬럼에 RPM 담아둔 것과 같은 종류의 오류다.
                // 어느 접점이 토출인지, 아니면 셋팅온도처럼 MES 입력값으로 받을지 미정이다.
                '<td class="none" title="토출온도 접점이 없다 — 어느 값으로 볼지 미정">—</td>' +
                (b && b.startedAt ? '<td>' + hhmm(b.startedAt) + '</td>' : '<td class="none">—</td>') +
                (b && b.finishedAt ? '<td>' + hhmm(b.finishedAt) + '</td>' : '<td class="none">—</td>') +
                (mixTime === null ? '<td class="none">—</td>' : '<td>' + mixTime + '</td>') +
              '</tr>' +
            '</tbody></table>';

        // 3행 — 압출. 구역 수는 PD1016M 배선(없으면 PLC 온도 접점) 개수다.
        var extrude;
        if (!cols) {
            extrude =
                '<table class="blk"><tbody><tr class="hd">' +
                  '<th class="side">압출</th><th class="rowh">구역</th>' +
                  '<th style="font-weight:600">이 호기에는 구역 온도 접점이 없다</th>' +
                '</tr></tbody></table>';
        } else {
            var hd = '', setr = '', curr = '';
            cells.forEach(function (c) {
                hd += '<th' + (c.title ? ' title="' + esc(c.title) + '"' : '') + '>' + c.label + '</th>';
                setr += (c.set === null || c.set === undefined)
                        ? '<td class="none" title="기준없음 — PD1016D 에 이 품목·구역의 셋팅온도가 없다">—</td>'
                        : '<td>' + num(c.set, 1) + '</td>';
                curr += cellVal(c.cur, 1);
            });
            extrude =
                '<table class="blk"><tbody>' +
                  '<tr class="hd">' +
                    '<th class="side" rowspan="3">압출</th>' +
                    '<th class="rowh">구역</th>' + hd +
                    '<th class="rowh">현재 RPM</th>' +
                  '</tr>' +
                  '<tr><th class="rowh">셋팅온도</th>' + setr +
                    (rpm && rpm.value !== null && rpm.value !== undefined
                        ? '<td class="rpm" rowspan="2">' + num(rpm.value, 0) + '</td>'
                        : '<td class="none" rowspan="2">—</td>') +
                  '</tr>' +
                  '<tr><th class="rowh">현재온도</th>' + curr + '</tr>' +
                '</tbody></table>';
        }

        el("equip").innerHTML = '<div class="eq">' + r1 +
                                '<div class="blkwrap">' + mixer + extrude + '</div></div>';
    }

    function loadEquipment() {
        if (!state.sel) { return Promise.resolve(); }
        var q = '/api/syp/equipment?equiCd=' + encodeURIComponent(state.sel) +
                '&pdirDt=' + encodeURIComponent(el('dt').value || today()) +
                (state.selPdir ? '&pdirNo=' + encodeURIComponent(state.selPdir) : '');
        return get(q).then(renderEquipment).catch(function (e) {
            el('equip').innerHTML = '<div class="err">' + esc(e.message || String(e)) + '</div>';
        });
    }

    function renderAll() {
        renderTabs();
        renderHead();
        autoSelect();
        renderTable();
    }

    function load() {
        var d = el('dt').value || today();

        return get('/api/syp/overview?pdirDt=' + encodeURIComponent(d))
            .then(function (res) {
                el('error').style.display = 'none';
                state.machines = res.machines || [];
                state.rows = res.rows || [];
                state.latest = res.latestPdirDt || null;

                if (!state.sel || !state.machines.some(function (m) { return m.equiCd === state.sel; })) {
                    state.sel = state.machines.length ? state.machines[0].equiCd : null;
                }
                renderAll();
                loadEquipment();
            })
            .catch(function (e) {
                var box = el('error');
                box.style.display = 'block';
                box.textContent = e.message || String(e);
            });
    }


    /*
     * 선택된 호기만 주기적으로 다시 읽는다. ★ 이게 이 화면의 실시간성이다.
     *
     * 주기를 1분으로 잡은 근거: PLC 수집이 1분 주기다(DATA_REGDT 가 smalldatetime,
     * 즉 분 해상도라 더 잘게 들어올 수도 없다). 그보다 자주 불러도 새 값이 없고
     * DG2000M 은 인덱스가 PK 하나뿐이라 조회가 전부 스캔이다.
     *
     * ★ 호기 순환·일시정지와 분리한다.
     *   전에는 갱신이 순환 타이머에 얹혀 있어서, 현장에서 한 호기를 들여다보려고
     *   일시정지를 누르면 숫자까지 같이 멈췄다. 일시정지는 화면이 넘어가지 않게 하는 것이고
     *   값은 계속 돌아야 한다.
     *
     * ★ 전 호기 overview 를 다시 부르지 않는다. 12호기 × 지시 전건이라 비싸다.
     *   선택된 호기의 지시만 갈아끼우고 탭 배지 건수를 다시 센다.
     */
    var POLL_MS = 60 * 1000;
    var pollTimer = null;
    var polling = false;

    function refreshSelected() {
        // 앞 요청이 아직 안 끝났거나 화면이 안 보이면 건너뛴다(스캔 쿼리라 겹치면 손해다).
        if (!state.sel || polling || document.hidden) { return Promise.resolve(); }
        polling = true;

        var sel = state.sel;
        var d = el('dt').value || today();

        return get('/api/syp/pdir?equiCd=' + encodeURIComponent(sel) +
                   '&pdirDt=' + encodeURIComponent(d))
            .then(function (res) {
                // 응답이 늦게 와서 그 사이 호기나 일자가 바뀌었으면 버린다.
                if (state.sel !== sel || (el('dt').value || today()) !== d) { return; }

                var fresh = res.rows || [];
                state.rows = state.rows
                        .filter(function (r) { return r.equiCd !== sel; })
                        .concat(fresh);

                // 탭 배지 건수는 overview 가 서버에서 세어 준 값이라 여기서 다시 센다.
                var m = state.machines.filter(function (x) { return x.equiCd === sel; })[0];
                if (m) { m.totalCount = fresh.length; }

                el('error').style.display = 'none';
                renderAll();
            })
            .then(loadEquipment)
            .catch(function (e) {
                var box = el('error');
                box.style.display = 'block';
                box.textContent = e.message || String(e);
            })
            .then(function () { polling = false; });
    }

    function schedulePoll() {
        if (pollTimer) { clearInterval(pollTimer); }
        pollTimer = setInterval(refreshSelected, POLL_MS);
    }

    // 탭을 가렸다 다시 보면 묵은 값이 떠 있다. 돌아온 즉시 한 번 받는다.
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { refreshSelected(); }
    });

    // 호기 순환. 원형 WinForms 화면이 30초마다 호기를 넘기던 동작을 그대로 가져온다.
    // 현장에서 특정 호기를 들여다보는 동안 화면이 넘어가면 곤란하니 일시정지를 둔다.
    function scheduleRotate() {
        if (rotTimer) { clearInterval(rotTimer); rotTimer = null; }
        var s = Number(el('rot').value);
        if (s > 0 && !state.paused) {
            rotTimer = setInterval(function () {
                if (!state.machines.length) { return; }
                var i = state.machines.findIndex(function (m) { return m.equiCd === state.sel; });
                state.sel = state.machines[(i + 1) % state.machines.length].equiCd;
                state.selPdir = null;   // 호기가 바뀌면 진행중 지시를 다시 자동선택
                renderAll();
                load();
            }, s * 1000);
        }
    }

    // 현장 마우스는 가로 휠이 없다. 탭 위에서는 세로 휠을 가로 스크롤로 돌린다.
    el('tabs').addEventListener('wheel', function (e) {
        if (!e.deltaY || this.scrollWidth <= this.clientWidth) { return; }
        e.preventDefault();
        this.scrollLeft += e.deltaY;
    }, { passive: false });

    el('dt').value = today();
    el('dt').addEventListener('change', load);
    el("rot").addEventListener("change", scheduleRotate);

    function renderPause() {
        var b = el('pauseBtn');
        b.textContent = state.paused ? '▶ 순환 재개' : '|| 일시정지';
        b.className = state.paused ? 'paused' : '';
        // 순환이 꺼져 있으면 일시정지 자체가 의미 없다.
        b.disabled = Number(el('rot').value) === 0;
    }

    el('pauseBtn').addEventListener('click', function () {
        state.paused = !state.paused;
        renderPause();
        scheduleRotate();
    });
    el('rot').addEventListener('change', renderPause);
    renderPause();
    el('latestBtn').addEventListener('click', function () {
        if (state.latest) { el('dt').value = state.latest; load(); }
    });

    load();
    scheduleRotate();
    schedulePoll();
})();
</script>

</body>
</html>
