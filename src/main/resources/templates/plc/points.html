<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SY폴리텍 PLC 접점</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0e131a;
            color: #f2f7fb;
            font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
            font-size: 16px;
        }
        header {
            display: flex; align-items: center; gap: 16px;
            padding: 12px 20px;
            background: #1b242f;
            border-bottom: 1px solid #3f5165;
            position: sticky; top: 0; z-index: 10;
        }
        header h1 { margin: 0; font-size: 19px; letter-spacing: -0.3px; }
        header .spacer { flex: 1; }
        header .meta { font-size: 11px; color: #ccd9e6; text-align: right; line-height: 1.5; }
        .wrap { padding: 18px 20px 40px; max-width: 1600px; margin: 0 auto; }

        /* 수집기 상태 */
        .collectors { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
        .col-card { padding: 16px 18px; background: #1b242f; border: 2px solid #3f5165; border-radius: 8px; }
        .col-card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .col-card .name { font-size: 17px; font-weight: 600; }
        .col-card .addr { font-size: 11px; color: #ccd9e6; }
        .col-card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
        .col-card dt { color: #ccd9e6; }
        .col-card dd { margin: 0; }
        .linechips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .linechip { padding: 4px 10px; border-radius: 5px; font-size: 13px; background: #131b24; border: 1px solid #3f5165; }

        /* 중단 경고 */
        .alarm {
            margin: 14px 0 0; padding: 12px 16px; border-radius: 8px;
            background: #3a1d20; border: 1px solid #6b2b31; color: #ffc4c9; line-height: 1.6;
        }
        .alarm b { color: #ff9aa3; }

        /* 도구 막대 */
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 12px; }
        .toolbar select, .toolbar button {
            padding: 6px 10px; background: #1b242f; color: #f2f7fb;
            border: 1px solid #3f5165; border-radius: 6px; font-size: 12px; cursor: pointer;
        }
        .toolbar label { font-size: 12px; color: #d5e0eb; }
        .toolbar .spacer { flex: 1; }
        .toolbar .note { font-size: 11px; color: #ccd9e6; }

        /* 라인 카드 */
        .lines { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 14px; }
        .line-card { background: #1b242f; border: 2px solid #3f5165; border-radius: 8px; overflow: hidden; }
        .line-card > h2 {
            margin: 0; padding: 13px 17px; font-size: 17px; font-weight: 700;
            background: #24313f; border-bottom: 3px solid #3f5165;
            display: flex; align-items: center; gap: 9px;
        }
        .line-card h2 .cnt { font-size: 14px; color: #ccd9e6; font-weight: 400; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 13px; text-align: left; border-bottom: 2px solid #38485a; }
        th { font-size: 14px; color: #f2f7fb; font-weight: 700; background: #24313f; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody td { font-size: 16px; }
        tbody tr:hover td { background: rgba(74,142,224,.10); }
        td.val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        td.val .num { font-size: 18px; font-weight: 700; }
        td.val .unit { font-size: 13px; color: #ccd9e6; margin-left: 2px; }
        td.range { text-align: right; font-size: 14px; color: #ccd9e6; white-space: nowrap; font-variant-numeric: tabular-nums; }
        td.when { font-size: 14px; color: #ccd9e6; white-space: nowrap; }
        tr.oor td.val .num { color: #ff9aa3; }
        tr.oor { background: #2a1a1d; }

        /* 배지 */
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
        .b-FRESH { background: #14361f; color: #7fe0a0; border: 1px solid #235c38; }
        .b-STALE { background: #3a3117; color: #ffd88a; border: 1px solid #6b5a25; }
        .b-DEAD  { background: #3a1d20; color: #ff9aa3; border: 1px solid #6b2b31; }
        .kind { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 12px; background: #131b24; border: 1px solid #3f5165; color: #d5e0eb; }
        .kind.UNKNOWN { color: #ff9aa3; border-color: #5a3438; }

        .empty { padding: 30px; text-align: center; color: #ccd9e6; }
        .err { margin: 14px 0; padding: 12px 16px; border-radius: 8px; background: #3a1d20; border: 1px solid #6b2b31; color: #ffc4c9; }
        button.logout { padding: 5px 10px; background: #232e3b; color: #cbd7e2; border: 1px solid #33414f; border-radius: 6px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>PLC 접점 현황</h1>
    <div class="spacer"></div>
    <div class="meta" id="headerMeta"></div>
    <a href="/plc/monitor"><button type="button" class="logout">현장 모니터링</button></a>
    <form th:action="@{/plc/logout}" method="post" style="margin:0">
        <button type="submit" class="logout">로그아웃</button>
    </form>
</header>

<div class="wrap">
    <div id="error" class="err" style="display:none"></div>
    <div class="collectors" id="collectors"></div>
    <div id="alarm"></div>

    <div class="toolbar">
        <label for="lineSel">라인</label>
        <select id="lineSel"><option value="">전체</option></select>

        <label for="lookbackSel">조회구간</label>
        <select id="lookbackSel">
            <option value="24">최근 24시간</option>
            <option value="168">최근 7일</option>
            <option value="720">최근 30일</option>
            <option value="175200">전체 기간 (마지막 알려진 값)</option>
        </select>

        <label for="refreshSel">자동 갱신</label>
        <select id="refreshSel">
            <option value="0">안 함</option>
            <option value="10" selected>10초</option>
            <option value="30">30초</option>
            <option value="60">60초</option>
        </select>

        <button type="button" id="reloadBtn">새로고침</button>
        <div class="spacer"></div>
        <span class="note" id="loadNote"></span>
    </div>

    <div class="lines" id="lines"></div>
</div>

<script th:inline="none">
(function () {
    'use strict';

    var el = function (id) { return document.getElementById(id); };
    var timer = null;

    function esc(s) {
        if (s === null || s === undefined) { return ''; }
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // 소수점 뒤 0은 떨어낸다. DG2000M.GATH_VAL 이 decimal(18,4) 라 38.5000 처럼 들어온다.
    function num(v) {
        if (v === null || v === undefined) { return null; }
        var n = Number(v);
        if (!isFinite(n)) { return null; }
        return String(parseFloat(n.toFixed(4)));
    }

    function dt(s) {
        if (!s) { return '-'; }
        return String(s).replace('T', ' ').substring(0, 16);
    }

    // 사람이 읽는 경과시간. 9개월 멈춘 걸 "23,000,000초"로 보여주면 아무도 못 읽는다.
    function age(sec) {
        if (sec === null || sec === undefined) { return '수집 이력 없음'; }
        var s = Number(sec);
        if (s < 60) { return s + '초 전'; }
        if (s < 3600) { return Math.floor(s / 60) + '분 전'; }
        if (s < 86400) { return Math.floor(s / 3600) + '시간 전'; }
        var d = Math.floor(s / 86400);
        if (d < 30) { return d + '일 전'; }
        if (d < 365) { return Math.floor(d / 30) + '개월 전'; }
        return (Math.floor(d / 36.5) / 10) + '년 전';
    }

    function badge(f) {
        return '<span class="badge b-' + esc(f) + '">' + esc(f) + '</span>';
    }

    function renderHealth(h) {
        el('headerMeta').innerHTML =
            'DB ' + esc(h.database || '-') + '<br>조회 ' + dt(h.serverTime);

        var out = '';
        (h.collectors || []).forEach(function (c) {
            var chips = (c.lines || []).map(function (l) {
                return '<span class="linechip">' + esc(l.line) + ' · ' + age(l.ageSeconds) + '</span>';
            }).join('');

            out +=
                '<div class="col-card">' +
                  '<div class="top">' +
                    '<span class="name">수집기 그룹 ' + esc(c.group) + '</span>' +
                    badge(c.freshness) +
                    '<span class="addr">' + esc(c.ip) + ':' + esc(c.port) + '</span>' +
                  '</div>' +
                  '<dl>' +
                    '<dt>마지막 적재</dt><dd>' + dt(c.lastCollectedAt) + ' <span style="color:#ccd9e6">(' + age(c.ageSeconds) + ')</span></dd>' +
                    '<dt>수집 주기</dt><dd>' + (c.cyclePeriodSeconds ? c.cyclePeriodSeconds + '초' : '-') +
                        ' <span style="color:#b3c2d1">' + esc(c.cron || '') + '</span></dd>' +
                    '<dt>접점 수</dt><dd>' + esc(c.expectedPointCount) + '</dd>' +
                  '</dl>' +
                  '<div class="linechips">' + chips + '</div>' +
                '</div>';
        });
        el('collectors').innerHTML = out;

        // 수집이 멈춘 걸 화면에서 숨기지 않는다. 기존 대시보드는 이걸 숨겨서
        // 9개월 / 2년 9개월 중단을 아무도 몰랐다.
        var dead = (h.collectors || []).filter(function (c) { return c.freshness !== 'FRESH'; });
        if (dead.length) {
            el('alarm').innerHTML =
                '<div class="alarm"><b>수집이 멈춰 있습니다.</b> 아래 값은 실시간이 아닙니다.<br>' +
                dead.map(function (c) {
                    return '그룹 ' + esc(c.group) + ' (' + esc(c.ip) + ':' + esc(c.port) + ') — 마지막 적재 ' +
                           dt(c.lastCollectedAt) + ' · ' + age(c.ageSeconds);
                }).join('<br>') +
                '</div>';
        } else {
            el('alarm').innerHTML = '';
        }
    }

    function renderPoints(points) {
        if (!points.length) {
            el('lines').innerHTML = '<div class="empty">표시할 접점이 없습니다.</div>';
            return;
        }

        var byLine = {};
        var order = [];
        points.forEach(function (p) {
            if (!byLine[p.line]) { byLine[p.line] = []; order.push(p.line); }
            byLine[p.line].push(p);
        });

        var out = '';
        order.forEach(function (line) {
            var rows = byLine[line].map(function (p) {
                var v = num(p.value);
                var mn = num(p.min), mx = num(p.max);
                return '<tr class="' + (p.outOfRange ? 'oor' : '') + '">' +
                    '<td>' + esc(p.id) + '</td>' +
                    '<td>' + esc(p.name) + ' <span class="kind ' + esc(p.kind) + '">' + esc(p.kind) + '</span></td>' +
                    '<td class="val">' + (v === null
                        ? '<span style="color:#b3c2d1">-</span>'
                        : '<span class="num">' + esc(v) + '</span>' +
                          (p.unit ? '<span class="unit">' + esc(p.unit) + '</span>' : '')) + '</td>' +
                    '<td class="range">' + (mn === null || mx === null ? '-' : esc(mn) + ' ~ ' + esc(mx)) + '</td>' +
                    '<td class="when">' + dt(p.collectedAt) + '</td>' +
                    '<td>' + badge(p.freshness) + '</td>' +
                '</tr>';
            }).join('');

            out +=
                '<div class="line-card">' +
                  '<h2>라인 ' + esc(line) +
                    '<span class="cnt">접점 ' + byLine[line].length + '</span>' +
                  '</h2>' +
                  '<table>' +
                    '<thead><tr><th>접점ID</th><th>명칭</th><th style="text-align:right">값</th>' +
                    '<th style="text-align:right">임계</th><th>수집시각</th><th>상태</th></tr></thead>' +
                    '<tbody>' + rows + '</tbody>' +
                  '</table>' +
                '</div>';
        });
        el('lines').innerHTML = out;
    }

    function showError(msg) {
        var e = el('error');
        e.style.display = 'block';
        e.textContent = msg;
    }

    function get(url) {
        return fetch(url, { credentials: 'same-origin' }).then(function (r) {
            if (r.status === 401 || r.status === 302 || r.redirected) {
                location.href = '/plc/login';
                throw new Error('세션이 만료되었습니다.');
            }
            return r.json().then(function (body) {
                if (!r.ok) {
                    throw new Error(body && body.message ? body.message : ('요청 실패 (' + r.status + ')'));
                }
                return body;
            });
        });
    }

    function load() {
        var line = el('lineSel').value;
        var lookback = el('lookbackSel').value;
        var qs = '?lookbackHours=' + encodeURIComponent(lookback) + (line ? '&line=' + encodeURIComponent(line) : '');
        var t0 = Date.now();

        el('loadNote').textContent = '불러오는 중...';

        Promise.all([get('/api/plc/health'), get('/api/plc/points' + qs)])
            .then(function (res) {
                el('error').style.display = 'none';
                renderHealth(res[0]);
                renderPoints(res[1]);
                el('loadNote').textContent =
                    '접점 ' + res[1].length + '개 · ' + (Date.now() - t0) + 'ms · ' +
                    new Date().toLocaleTimeString('ko-KR');
            })
            .catch(function (e) {
                el('loadNote').textContent = '';
                showError(e.message || String(e));
            });
    }

    function schedule() {
        if (timer) { clearInterval(timer); timer = null; }
        var s = Number(el('refreshSel').value);
        if (s > 0) { timer = setInterval(load, s * 1000); }
    }

    function initLines() {
        return get('/api/plc/lines').then(function (lines) {
            var sel = el('lineSel');
            lines.forEach(function (l) {
                var o = document.createElement('option');
                o.value = l.line;
                o.textContent = l.line + ' (' + l.pointCount + '점, 그룹 ' + (l.collectorGroup || '?') + ')';
                sel.appendChild(o);
            });
        });
    }

    el('reloadBtn').addEventListener('click', load);
    el('lineSel').addEventListener('change', load);
    el('lookbackSel').addEventListener('change', load);
    el('refreshSel').addEventListener('change', schedule);

    initLines().catch(function () { /* 라인 목록 실패해도 본문은 시도한다 */ }).then(load);
    schedule();
})();
</script>

</body>
</html>
